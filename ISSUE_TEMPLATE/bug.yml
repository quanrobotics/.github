name: Bug Report
description: Report a reproducible problem in QuanRobotics software or tooling.
title: "[BUG] "

body:
  - type: markdown
    attributes:
      value: |
        Please do not include passwords, API keys, access tokens,
        confidential information, or personal data.

  - type: textarea
    id: summary
    attributes:
      label: Problem Summary
      description: Clearly explain what is going wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Ubuntu 24.04, Python 3.12, ROS 2, etc.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, test output, or links without confidential data.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What must be true before this issue can be closed?
    validations:
      required: true
